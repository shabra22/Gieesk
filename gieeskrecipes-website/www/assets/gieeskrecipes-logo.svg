<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>
  <!-- GieesK text — Gieees in dark, K in gold -->
  <text
    x="12" y="88"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="82"
    font-weight="900"
    letter-spacing="-2"
    filter="url(#shadow)"
  >
    <tspan fill="url(#darkGrad)">Giees</tspan><tspan fill="url(#goldGrad)">K</tspan>
  </text>
</svg>
